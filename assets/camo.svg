<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <title>Camouflage texture</title>
  <filter id="camo" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.04" numOctaves="4" seed="11" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="
      0 0 0 0 0.14
      0 0 0 0 0.16
      0 0 0 0 0.10
      0 0 0 0.55 0"/>
  </filter>
  <rect width="400" height="400" filter="url(#camo)"/>
</svg>
